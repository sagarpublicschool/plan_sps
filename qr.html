<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathurapur Payment Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 5px; font-size: 24px; }
        h3 { color: #5f6368; text-align: center; margin-top: 0; margin-bottom: 20px; font-weight: 400; }
        
        label { display: block; margin-top: 15px; font-weight: 600; color: #3c4043; font-size: 14px; }
        select, input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; }
        select:focus, input:focus { border: 2px solid #1a73e8; }

        .total-box { background: #e8f0fe; border-radius: 10px; padding: 20px; text-align: center; margin-top: 25px; border: 1px solid #1a73e8; }
        .total-box label { display: block; margin: 0; color: #1a73e8; font-size: 12px; text-transform: uppercase; font-weight: bold; }
        .total-box span { font-size: 32px; font-weight: 800; color: #1a73e8; }

        /* QR Code Styling */
        #qr-container { text-align: center; margin-top: 20px; display: none; padding: 15px; border: 2px dashed #1a73e8; border-radius: 10px; background: #fff; }
        #qr-container img { width: 200px; height: 200px; margin-bottom: 10px; }
        .qr-text { font-size: 13px; color: #555; margin-bottom: 10px; display: block; }

        button { width: 100%; background: #28a745; color: white; border: none; padding: 16px; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 25px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #218838; }
        
        #status { font-size: 12px; color: #d93025; text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body onload="fetchNames()">

<div class="container">
    <h1>Payment Portal</h1>
    <h3>Cloud Based Management System</h3>

    <label>Select Name</label>
    <select id="userNames">
        <option value="">SELECT NAME </option>
    </select>

    <label>Select Plan</label>
    <select id="plan" onchange="calculateTotal()">
        <option value="07">Basic - Rs 07</option>
        <option value="10">Regular - Rs 10</option>
        <option value="15">Advanced - Rs 15</option>
    </select>

    <label>No. of Students</label>
    <input type="number" id="students" value="1" min="1" oninput="calculateTotal()">

    <label>Other Amount (Optional)</label>
    <input type="number" id="otherAmount" placeholder="Enter custom amount" oninput="calculateTotal()">

    <div class="total-box">
        <label>Total Amount to Pay</label>
        <span>₹<span id="finalTotal">7</span></span>
    </div>

    <div id="qr-container">
        <span class="qr-text">Is QR Code ko scan karein:</span>
        <img id="qr-image" src="" alt="UPI QR Code">
        <p style="font-weight: bold; color: #1a73e8;">Amount: ₹<span id="qr-amount-text">0</span></p>
    </div>

    <button id="payBtn" onclick="processPayment()">PAY NOW</button>
    <div id="status"></div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwG9QSGvrUZPzQKEp1WCcIj88Amwn1XWNUD60ZGEWWu_ci87dSlGyiRMH_Oh4UP4KZ/exec";
    
    async function fetchNames() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            const dropdown = document.getElementById('userNames');
            if (data.length > 0) {
                dropdown.innerHTML = '<option value="">SELECT NAME </option>' + data.map(n => `<option value="${n}">${n}</option>`).join('');
            }
        } catch (error) {
            document.getElementById('status').innerText = "Names load nahi ho sake.";
        }
    }

    function calculateTotal() {
        const rate = parseInt(document.getElementById('plan').value) || 0;
        const count = parseInt(document.getElementById('students').value) || 0;
        const other = document.getElementById('otherAmount').value;
        let total = (other !== "" && parseInt(other) > 0) ? parseInt(other) : (rate * count);
        document.getElementById('finalTotal').innerText = total;
        // QR Code hide kar dete hain jab amount change ho taaki purana QR scan na ho jaye
        document.getElementById('qr-container').style.display = 'none';
        return total;
    }

    function processPayment() {
        const amount = calculateTotal();
        const selectedUser = document.getElementById('userNames').value;

        if (!selectedUser) {
            Swal.fire({ icon: 'warning', title: 'Opps...', text: 'Kripya pehle naam select karein!' });
            return;
        }

        // Google Sheet update call
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                name: selectedUser,
                plan: document.getElementById('plan').options[document.getElementById('plan').selectedIndex].text,
                students: document.getElementById('students').value,
                total: amount
            })
        });

        // --- QR CODE GENERATION ---
        const upiID = "7549976381@kotak";
        const payeeName = "NISHAT BANU"; 
        const upiUrl = `upi://pay?pa=${upiID}&pn=${encodeURIComponent(payeeName)}&am=${amount}&cu=INR&tn=MathurapurPayment`;
        
        // QR Server API ka use karke QR generate karna
        const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiUrl)}`;
        
        const qrContainer = document.getElementById('qr-container');
        const qrImage = document.getElementById('qr-image');
        const qrAmtText = document.getElementById('qr-amount-text');

        qrImage.src = qrImgUrl;
        qrAmtText.innerText = amount;
        qrContainer.style.display = 'block'; // QR dikhayein
        
        // Mobile users ke liye direct app kholne ka option (optional)
        Swal.fire({
            title: 'QR Code Tayar Hai',
            text: "Aap niche diye gaye QR ko scan karein ya 'Open App' par click karein.",
            icon: 'success',
            showCancelButton: true,
            confirmButtonText: 'Open UPI App',
            cancelButtonText: 'Close'
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = upiUrl;
            }
        });
    }
</script>

</body>
</html>
